<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000000'/%3E%3Ctext x='256' y='200' text-anchor='middle' font-family='Georgia, serif' font-size='96' font-weight='300' fill='%23ffffff' letter-spacing='8'%3E三径%3C/text%3E%3Ctext x='256' y='285' text-anchor='middle' font-family='Georgia, serif' font-size='32' font-weight='200' fill='%23aaaaaa' letter-spacing='6'%3Esanjing%3C/text%3E%3C/svg%3E" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000000'/%3E%3Ctext x='256' y='200' text-anchor='middle' font-family='Georgia, serif' font-size='96' font-weight='300' fill='%23ffffff' letter-spacing='8'%3E三径%3C/text%3E%3Ctext x='256' y='285' text-anchor='middle' font-family='Georgia, serif' font-size='32' font-weight='200' fill='%23aaaaaa' letter-spacing='6'%3Esanjing%3C/text%3E%3C/svg%3E" />

  <title>三径 · 私人音乐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f3f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Georgia", "Times New Roman", serif;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: radial-gradient(ellipse at 50% 45%, #faf8f6 0%, #ece8e2 100%);
      overflow: hidden;
      cursor: pointer;
      transition: background 1.8s ease;
    }
    #app.cosmic-mode { background: #050505 !important; }
    #texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.15;
      background-image: 
        linear-gradient(rgba(180,170,160,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,170,160,0.08) 1px, transparent 1px),
        repeating-linear-gradient(45deg, transparent 0px, transparent 80px, rgba(160,150,140,0.03) 80px, rgba(160,150,140,0.03) 81px),
        repeating-linear-gradient(-45deg, transparent 0px, transparent 80px, rgba(160,150,140,0.03) 80px, rgba(160,150,140,0.03) 81px);
      background-size: 40px 40px, 40px 40px, 160px 160px, 160px 160px;
      transition: opacity 1.8s ease;
    }
    #app.cosmic-mode #texture { opacity: 0.35; }
    #texture::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(1px 1px at 10% 20%, rgba(140,130,120,0.15), transparent),
        radial-gradient(1px 1px at 30% 60%, rgba(140,130,120,0.1), transparent),
        radial-gradient(1.5px 1.5px at 55% 15%, rgba(140,130,120,0.12), transparent),
        radial-gradient(1px 1px at 70% 80%, rgba(140,130,120,0.08), transparent),
        radial-gradient(1px 1px at 85% 40%, rgba(140,130,120,0.1), transparent),
        radial-gradient(1.2px 1.2px at 15% 85%, rgba(140,130,120,0.06), transparent),
        radial-gradient(1px 1px at 45% 45%, rgba(140,130,120,0.04), transparent),
        radial-gradient(1px 1px at 92% 10%, rgba(140,130,120,0.07), transparent),
        radial-gradient(0.8px 0.8px at 5% 50%, rgba(140,130,120,0.09), transparent),
        radial-gradient(1px 1px at 60% 92%, rgba(140,130,120,0.05), transparent);
      transition: opacity 1.8s ease;
    }
    #app.cosmic-mode #texture::after { opacity: 0.6; }

    #cosmic-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 2s ease;
    }
    #app.cosmic-mode #cosmic-lines { opacity: 1; }
    #cosmic-lines svg {
      width: 100%;
      height: 100%;
      animation: rotate-cosmic 40s linear infinite;
    }
    @keyframes rotate-cosmic {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #cosmic-dots {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 2.5s ease;
    }
    #app.cosmic-mode #cosmic-dots { opacity: 0.8; }
    .dot-particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: drift-particle 8s linear infinite;
    }
    @keyframes drift-particle {
      0% { transform: translate(0,0); opacity: 0.1; }
      50% { opacity: 0.9; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0.1; }
    }

    #record-wrapper {
      position: relative;
      width: 420px;
      height: 420px;
      touch-action: none;
      cursor: grab;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 1.8s ease;
      z-index: 5;
      pointer-events: auto;
    }
    #app.cosmic-mode #record-wrapper { opacity: 0.6; }
    #record-wrapper:active { cursor: grabbing; }
    #record-wrapper.swiping { transition: none; }

    #record {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 30% 35%, #4a4540 0%, #1a1816 40%, #0d0c0a 70%, #050505 100%);
      box-shadow: 0 30px 100px rgba(0,0,0,0.1), 0 0 0 1.5px rgba(180,170,160,0.12), inset 0 0 80px rgba(0,0,0,0.2), inset 0 0 160px rgba(0,0,0,0.1);
      animation: spin-record 18s linear infinite;
      animation-play-state: paused;
      position: relative;
    }
    #app.cosmic-mode #record {
      box-shadow: 0 30px 100px rgba(255,255,255,0.03), 0 0 0 1.5px rgba(255,255,255,0.05), inset 0 0 80px rgba(0,0,0,0.4), inset 0 0 160px rgba(0,0,0,0.2);
    }
    @keyframes spin-record {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #record::before {
      content: '';
      position: absolute;
      top: 12%;
      left: 12%;
      width: 76%;
      height: 76%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.02);
      box-shadow: inset 0 0 0 10px rgba(255,255,255,0.01), inset 0 0 0 28px rgba(255,255,255,0.005), inset 0 0 0 55px rgba(255,255,255,0.01), inset 0 0 0 80px rgba(255,255,255,0.005), inset 0 0 0 110px rgba(255,255,255,0.01);
    }
    #record-shine {
      position: absolute;
      top: -8%;
      left: -8%;
      width: 116%;
      height: 116%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.04) 0%, transparent 60%);
    }
    #progress-ring {
      position: absolute;
      top: -16px;
      left: -16px;
      width: calc(100% + 32px);
      height: calc(100% + 32px);
      border-radius: 50%;
      pointer-events: none;
    }
    #progress-ring svg { transform: rotate(-90deg); }
    #progress-ring circle {
      fill: none;
      stroke: rgba(255,255,255,0.04);
      stroke-width: 1.2;
    }
    #progress-ring .progress-circle {
      stroke: rgba(255,255,255,0.12);
      stroke-dasharray: 1370;
      stroke-dashoffset: 1370;
      transition: stroke-dashoffset 0.8s ease;
    }

    #record-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 35% 30%, #f5f0ea, #d5cfc7);
      box-shadow: inset 0 2px 10px rgba(255,255,255,0.3), inset 0 -4px 20px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
    }
    #record-label::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #3a3836, #0a0908);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }
    #label-text {
      font-size: 12px;
      letter-spacing: 6px;
      color: rgba(80,75,70,0.35);
      font-weight: 300;
      text-transform: uppercase;
      margin-top: -8px;
      font-family: "Georgia", serif;
      text-align: center;
    }
    #label-text small {
      display: block;
      font-size: 7px;
      letter-spacing: 4px;
      opacity: 0.3;
      margin-top: 4px;
      font-weight: 300;
    }

    #timer-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #timer {
      color: rgba(255,255,255,0.8);
      font-size: 96px;
      font-weight: 200;
      letter-spacing: 12px;
      font-family: "Georgia", "Times New Roman", serif;
      text-shadow: 0 0 60px rgba(255,255,255,0.03);
      line-height: 1;
      transition: opacity 1.2s ease;
      pointer-events: none;
      background: transparent;
    }
    #timer.paused { opacity: 0.2; }
    #timer.completed { opacity: 0.06 !important; }
    #timer-dots {
      margin-top: 24px;
      display: flex;
      gap: 10px;
      pointer-events: none;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      transition: background 0.8s ease, transform 0.8s ease;
    }
    .dot.filled { background: rgba(255,255,255,0.25); }

    #tonearm {
      position: absolute;
      top: -12%;
      right: -6%;
      width: 150px;
      height: 2.5px;
      background: linear-gradient(to right, rgba(180,170,160,0.05), rgba(180,170,160,0.12));
      transform: rotate(25deg);
      transform-origin: right center;
      border-radius: 2px;
      pointer-events: none;
    }
    #tonearm::after {
      content: '';
      position: absolute;
      right: -5px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(180,170,160,0.08);
    }

    #info {
      position: absolute;
      bottom: 14%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(120,110,100,0.2);
      font-size: 14px;
      letter-spacing: 4px;
      transition: opacity 1.8s ease;
      pointer-events: none;
      z-index: 5;
    }
    #app.cosmic-mode #info { opacity: 0.2; }
    #track-index {
      font-size: 11px;
      opacity: 0.15;
      letter-spacing: 3px;
    }
    #track-name {
      font-size: 18px;
      color: rgba(80,75,70,0.25);
      transition: opacity 2s ease;
      letter-spacing: 3px;
      font-weight: 300;
      text-align: center;
      max-width: 80vw;
      line-height: 1.5;
    }
    #track-name.show { opacity: 0.45; }
    #track-source {
      font-size: 11px;
      color: rgba(80,75,70,0.12);
      letter-spacing: 2px;
      font-weight: 300;
      margin-top: 2px;
      transition: opacity 2s ease;
    }
    #track-source.show { opacity: 0.25; }

    #swipe-hint {
      position: absolute;
      bottom: 26%;
      display: flex;
      gap: 50px;
      color: rgba(120,110,100,0.03);
      font-size: 28px;
      letter-spacing: 12px;
      pointer-events: none;
      font-weight: 100;
      z-index: 5;
      transition: opacity 1.8s ease;
    }
    #app.cosmic-mode #swipe-hint { opacity: 0.05; }

    #help-tip {
      position: absolute;
      bottom: 3.5%;
      color: rgba(120,110,100,0.04);
      font-size: 11px;
      letter-spacing: 2px;
      font-family: sans-serif;
      font-weight: 300;
      pointer-events: none;
      z-index: 5;
      transition: opacity 1.8s ease;
    }
    #app.cosmic-mode #help-tip { opacity: 0.05; }

    #ripple-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    .ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      border: 2px solid rgba(180,170,160,0.12);
      transform: translate(-50%, -50%);
      animation: ripple-expand 3.5s ease-out forwards;
    }
    @keyframes ripple-expand {
      0% { width: 0; height: 0; opacity: 1; border-width: 3px; }
      100% { width: 900px; height: 900px; opacity: 0; border-width: 0.5px; }
    }
    .ripple.delay-1 { animation-delay: 0.3s; }
    .ripple.delay-2 { animation-delay: 0.6s; }
    .ripple.delay-3 { animation-delay: 0.9s; }
    .ripple.delay-4 { animation-delay: 1.2s; }

    #pulse-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(204,180,150,0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #pulse-glow.active {
      animation: glow-pulse 1.5s ease-out forwards;
    }
    @keyframes glow-pulse {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      25% { opacity: 0.6; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(4); }
    }

    #milestone-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(80,75,70,0);
      font-size: 28px;
      letter-spacing: 8px;
      font-weight: 200;
      pointer-events: none;
      z-index: 25;
      transition: opacity 2.5s ease;
      font-family: "Georgia", serif;
      opacity: 0;
    }
    #milestone-text.show { opacity: 0.2; }
    #milestone-text.hide { opacity: 0; }

    #audio-error {
      position: absolute;
      bottom: 22%;
      color: rgba(180,80,80,0.25);
      font-size: 13px;
      letter-spacing: 1px;
      font-family: sans-serif;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 1s ease;
      text-align: center;
      line-height: 1.8;
      max-width: 80vw;
    }
    #audio-error.show { opacity: 1; }

    @media (max-width: 600px) {
      #record-wrapper { width: 340px; height: 340px; }
      #timer { font-size: 72px; letter-spacing: 8px; }
      #record-label { width: 85px; height: 85px; }
      #label-text { font-size: 10px; letter-spacing: 4px; }
      #label-text small { font-size: 6px; letter-spacing: 3px; }
      #record-label::before { width: 8px; height: 8px; }
      #track-name { font-size: 15px; letter-spacing: 2px; }
      #track-source { font-size: 10px; }
      #timer-dots { gap: 8px; }
      .dot { width: 6px; height: 6px; }
      #progress-ring circle { stroke-width: 1; }
      #milestone-text { font-size: 22px; letter-spacing: 6px; }
      #swipe-hint { font-size: 22px; gap: 40px; bottom: 24%; }
      #info { bottom: 12%; }
      @keyframes ripple-expand {
        0% { width: 0; height: 0; }
        100% { width: 700px; height: 700px; }
      }
    }
    @media (max-width: 420px) {
      #record-wrapper { width: 260px; height: 260px; }
      #timer { font-size: 52px; letter-spacing: 6px; }
      #record-label { width: 65px; height: 65px; }
      #label-text { font-size: 8px; letter-spacing: 3px; }
      #label-text small { font-size: 5px; letter-spacing: 2px; }
      #record-label::before { width: 6px; height: 6px; }
      #track-name { font-size: 13px; letter-spacing: 2px; }
      #track-source { font-size: 9px; }
      #timer-dots { gap: 6px; margin-top: 16px; }
      .dot { width: 5px; height: 5px; }
      #progress-ring circle { stroke-width: 0.8; }
      #milestone-text { font-size: 18px; letter-spacing: 5px; }
      #swipe-hint { font-size: 18px; gap: 30px; bottom: 22%; }
      #info { bottom: 10%; }
      #track-index { font-size: 9px; }
      #help-tip { font-size: 9px; bottom: 3%; }
      @keyframes ripple-expand {
        0% { width: 0; height: 0; }
        100% { width: 500px; height: 500px; }
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="texture"></div>

    <div id="cosmic-lines">
      <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="500" cy="500" rx="400" ry="80" stroke="rgba(255,255,255,0.04)" stroke-width="0.8" fill="none"/>
        <ellipse cx="500" cy="500" rx="350" ry="140" stroke="rgba(255,255,255,0.03)" stroke-width="0.6" fill="none"/>
        <ellipse cx="500" cy="500" rx="300" ry="190" stroke="rgba(255,255,255,0.035)" stroke-width="0.7" fill="none"/>
        <ellipse cx="500" cy="500" rx="250" ry="230" stroke="rgba(255,255,255,0.025)" stroke-width="0.5" fill="none"/>
        <ellipse cx="500" cy="500" rx="200" ry="260" stroke="rgba(255,255,255,0.03)" stroke-width="0.6" fill="none"/>
        <ellipse cx="500" cy="500" rx="150" ry="280" stroke="rgba(255,255,255,0.02)" stroke-width="0.4" fill="none"/>
        <ellipse cx="500" cy="500" rx="100" ry="290" stroke="rgba(255,255,255,0.025)" stroke-width="0.5" fill="none"/>
        <ellipse cx="500" cy="500" rx="80" ry="400" stroke="rgba(255,255,255,0.04)" stroke-width="0.8" fill="none" transform="rotate(0,500,500)"/>
        <ellipse cx="500" cy="500" rx="140" ry="350" stroke="rgba(255,255,255,0.03)" stroke-width="0.6" fill="none" transform="rotate(15,500,500)"/>
        <ellipse cx="500" cy="500" rx="190" ry="300" stroke="rgba(255,255,255,0.035)" stroke-width="0.7" fill="none" transform="rotate(30,500,500)"/>
        <ellipse cx="500" cy="500" rx="230" ry="250" stroke="rgba(255,255,255,0.025)" stroke-width="0.5" fill="none" transform="rotate(45,500,500)"/>
        <ellipse cx="500" cy="500" rx="260" ry="200" stroke="rgba(255,255,255,0.03)" stroke-width="0.6" fill="none" transform="rotate(60,500,500)"/>
        <ellipse cx="500" cy="500" rx="280" ry="150" stroke="rgba(255,255,255,0.02)" stroke-width="0.4" fill="none" transform="rotate(75,500,500)"/>
        <ellipse cx="500" cy="500" rx="290" ry="100" stroke="rgba(255,255,255,0.025)" stroke-width="0.5" fill="none" transform="rotate(90,500,500)"/>
        <radialGradient id="centerGlow">
          <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
        <circle cx="500" cy="500" r="200" fill="url(#centerGlow)"/>
        <circle cx="120" cy="200" r="1.5" fill="rgba(255,255,255,0.15)"/>
        <circle cx="850" cy="150" r="1" fill="rgba(255,255,255,0.1)"/>
        <circle cx="780" cy="800" r="1.5" fill="rgba(255,255,255,0.12)"/>
        <circle cx="200" cy="850" r="1" fill="rgba(255,255,255,0.08)"/>
        <circle cx="50" cy="500" r="1.2" fill="rgba(255,255,255,0.1)"/>
        <circle cx="950" cy="450" r="1" fill="rgba(255,255,255,0.09)"/>
        <circle cx="400" cy="80" r="1.3" fill="rgba(255,255,255,0.11)"/>
        <circle cx="650" cy="920" r="1" fill="rgba(255,255,255,0.07)"/>
      </svg>
    </div>

    <div id="cosmic-dots"></div>
    <div id="ripple-container"></div>
    <div id="pulse-glow"></div>
    <div id="milestone-text"></div>
    <div id="audio-error"></div>
    <div id="swipe-hint">〈  〉</div>

    <div id="record-wrapper">
      <div id="record">
        <div id="record-shine"></div>
        <div id="progress-ring">
          <svg width="100%" height="100%" viewBox="0 0 452 452">
            <circle cx="226" cy="226" r="210" />
            <circle class="progress-circle" cx="226" cy="226" r="210" />
          </svg>
        </div>
        <div id="tonearm"></div>
        <div id="record-label">
          <span id="label-text">三径<small>sanjing</small></span>
        </div>
        <div id="timer-wrapper">
          <div id="timer">00:00</div>
          <div id="timer-dots">
            <span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </div>

    <div id="info">
      <span id="track-index">1 / 2</span>
      <span id="track-name">回首向来萧瑟处，归去，也无风雨也无晴。</span>
      <span id="track-source">—— 苏轼《定风波》</span>
    </div>
    <div id="help-tip">点击任意处 播放/暂停 · 滑动唱片换歌</div>
  </div>

  <script>
    // =============================================
    // 音乐数据（m4a 格式）
    // =============================================
    const MONTHLY_TRACKS = [
      { 
        id: 1, 
        title: "回首向来萧瑟处，归去，也无风雨也无晴。",
        source: "—— 苏轼《定风波》",
        url: "music/track-01.m4a"
      },
      { 
        id: 2, 
        title: "长风破浪会有时，直挂云帆济沧海。",
        source: "—— 李白《行路难》",
        url: "music/track-02.m4a"
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let audio = new Audio();
    let volumeLevel = 0.5;

    let seconds = 0;
    const MAX_SECONDS = 2400;
    let timerInterval = null;
    let isTimerRunning = false;
    let lastMilestone = 0;

    let cosmicTimeout = null;
    let audioErrorEl = document.getElementById('audio-error');

    let startX = 0;
    let currentX = 0;
    let isDragging = false;
    let hasSwiped = false;
    const SWIPE_THRESHOLD = 60;

    const app = document.getElementById('app');
    const wrapper = document.getElementById('record-wrapper');
    const timerEl = document.getElementById('timer');
    const dots = document.querySelectorAll('.dot');
    const progressCircle = document.querySelector('.progress-circle');
    const record = document.getElementById('record');
    const trackIndexEl = document.getElementById('track-index');
    const trackNameEl = document.getElementById('track-name');
    const trackSourceEl = document.getElementById('track-source');
    const rippleContainer = document.getElementById('ripple-container');
    const pulseGlow = document.getElementById('pulse-glow');
    const milestoneText = document.getElementById('milestone-text');
    const cosmicDots = document.getElementById('cosmic-dots');

    const CIRCUMFERENCE = 1370;

    const MILESTONE_MESSAGES = [
      "10 分钟 · 气息渐稳",
      "20 分钟 · 身体下沉",
      "30 分钟 · 心若止水",
      "40 分钟 · 圆满"
    ];

    // =============================================
    // 生成流动光点
    // =============================================
    function generateCosmicDots() {
      cosmicDots.innerHTML = '';
      for (let i = 0; i < 60; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot-particle';
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const dx = (Math.random() - 0.5) * 200;
        const dy = (Math.random() - 0.5) * 200;
        const size = 1 + Math.random() * 2;
        const duration = 6 + Math.random() * 6;
        dot.style.left = x + '%';
        dot.style.top = y + '%';
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.setProperty('--dx', dx + 'px');
        dot.style.setProperty('--dy', dy + 'px');
        dot.style.animationDuration = duration + 's';
        dot.style.animationDelay = (Math.random() * 4) + 's';
        dot.style.opacity = 0.1 + Math.random() * 0.3;
        cosmicDots.appendChild(dot);
      }
    }
    generateCosmicDots();

    // =============================================
    // 宇宙模式
    // =============================================
    function triggerCosmicMode(minute) {
      if (navigator.vibrate) {
        navigator.vibrate([30, 50, 20, 50, 40]);
      }
      for (let i = 0; i < 4; i++) {
        const ripple = document.createElement('div');
        if (i === 0) ripple.className = 'ripple';
        else if (i === 1) ripple.className = 'ripple delay-1';
        else if (i === 2) ripple.className = 'ripple delay-2';
        else if (i === 3) ripple.className = 'ripple delay-3';
        rippleContainer.appendChild(ripple);
        setTimeout(() => ripple.remove(), 4000);
      }
      pulseGlow.classList.remove('active');
      void pulseGlow.offsetWidth;
      pulseGlow.classList.add('active');
      setTimeout(() => pulseGlow.classList.remove('active'), 1600);

      const msgIndex = Math.min(Math.floor(minute / 10) - 1, MILESTONE_MESSAGES.length - 1);
      const msg = MILESTONE_MESSAGES[msgIndex] || `—— ${minute} 分钟 ——`;
      milestoneText.textContent = msg;
      milestoneText.className = 'show';
      setTimeout(() => { milestoneText.className = 'hide'; }, 3000);

      app.classList.add('cosmic-mode');
      if (cosmicTimeout) clearTimeout(cosmicTimeout);
      cosmicTimeout = setTimeout(() => {
        app.classList.remove('cosmic-mode');
        cosmicTimeout = null;
      }, 10000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateTimer() {
      timerEl.textContent = formatTime(seconds);
      const progress = seconds / MAX_SECONDS;
      progressCircle.style.strokeDashoffset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);

      const filledDots = Math.floor(progress * 5);
      dots.forEach((dot, i) => {
        dot.classList.toggle('filled', i < filledDots);
      });

      const currentMinute = Math.floor(seconds / 60);
      if (currentMinute >= 10 && currentMinute % 10 === 0 && currentMinute !== lastMilestone && seconds < MAX_SECONDS) {
        lastMilestone = currentMinute;
        triggerCosmicMode(currentMinute);
      }

      if (seconds >= MAX_SECONDS) {
        timerEl.classList.add('completed');
        if (isTimerRunning) {
          isTimerRunning = false;
          clearInterval(timerInterval);
          timerInterval = null;
        }
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          record.style.animationPlayState = 'paused';
        }
        if (lastMilestone !== 40) {
          lastMilestone = 40;
          triggerCosmicMode(40);
        }
      } else {
        timerEl.classList.remove('completed');
      }
    }

    function startTimer() {
      if (isTimerRunning) return;
      if (seconds >= MAX_SECONDS) {
        seconds = 0;
        lastMilestone = 0;
        updateTimer();
        timerEl.classList.remove('completed');
      }
      isTimerRunning = true;
      timerEl.classList.remove('paused');
      timerInterval = setInterval(() => {
        if (seconds < MAX_SECONDS) {
          seconds++;
          updateTimer();
        } else {
          updateTimer();
          stopTimer();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      isTimerRunning = false;
      timerEl.classList.add('paused');
    }

    function resetTimer() {
      stopTimer();
      seconds = 0;
      lastMilestone = 0;
      updateTimer();
      timerEl.classList.remove('completed', 'paused');
      timerEl.classList.add('paused');
      milestoneText.className = 'hide';
      app.classList.remove('cosmic-mode');
      if (cosmicTimeout) {
        clearTimeout(cosmicTimeout);
        cosmicTimeout = null;
      }
    }

    // =============================================
    // 加载歌曲
    // =============================================
    function loadTrack(index, animate = true) {
      const track = MONTHLY_TRACKS[index];
      if (!track) return;

      audio.src = track.url;
      audio.volume = volumeLevel;
      audio.loop = false;

      audio.onerror = function() {
        audioErrorEl.textContent = '⚠️ 音乐加载失败\n请检查 music/ 文件夹是否有 track-01.m4a 和 track-02.m4a';
        audioErrorEl.classList.add('show');
        console.error('❌ 音频加载失败:', track.url);
      };

      audio.oncanplaythrough = function() {
        audioErrorEl.classList.remove('show');
        console.log('✅ 音频加载成功:', track.url);
      };

      trackIndexEl.textContent = `${index + 1} / ${MONTHLY_TRACKS.length}`;
      trackNameEl.textContent = track.title;
      trackSourceEl.textContent = track.source;
      trackNameEl.classList.remove('show');
      trackSourceEl.classList.remove('show');

      resetTimer();

      if (isPlaying) {
        audio.play().catch(e => console.log('等待用户手势'));
        startTimer();
        record.style.animationPlayState = 'running';
      }

      if (animate) {
        trackNameEl.classList.add('show');
        trackSourceEl.classList.add('show');
        setTimeout(() => {
          trackNameEl.classList.remove('show');
          trackSourceEl.classList.remove('show');
        }, 4000);
      }
    }

    // =============================================
    // 播放/暂停
    // =============================================
    function togglePlay() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch(e) {}

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        stopTimer();
        record.style.animationPlayState = 'paused';
      } else {
        audio.play().then(() => {
          isPlaying = true;
          startTimer();
          record.style.animationPlayState = 'running';
          audioErrorEl.classList.remove('show');
          console.log('▶️ 播放成功');
        }).catch((e) => {
          audioErrorEl.textContent = '⚠️ 播放失败: ' + e.message;
          audioErrorEl.classList.add('show');
          console.error('❌ 播放失败:', e.message);
        });
      }
    }

    function goToNext() {
      if (currentIndex >= MONTHLY_TRACKS.length - 1) return;
      audio.pause();
      isPlaying = false;
      stopTimer();
      currentIndex++;
      loadTrack(currentIndex, true);
      audio.play().catch(() => {});
      isPlaying = true;
      startTimer();
      record.style.animationPlayState = 'running';
    }

    function goToPrev() {
      if (currentIndex <= 0) return;
      audio.pause();
      isPlaying = false;
      stopTimer();
      currentIndex--;
      loadTrack(currentIndex, true);
      audio.play().catch(() => {});
      isPlaying = true;
      startTimer();
      record.style.animationPlayState = 'running';
    }

    // =============================================
    // 点击事件
    // =============================================
    app.addEventListener('click', function(e) {
      if (hasSwiped) {
        hasSwiped = false;
        return;
      }
      togglePlay();
    });

    // =============================================
    // 滑动换歌
    // =============================================
    wrapper.addEventListener('touchstart', function(e) {
      hasSwiped = false;
      const touch = e.touches[0];
      startX = touch.clientX;
      currentX = startX;
      isDragging = true;
      wrapper.classList.add('swiping');
      wrapper.style.transition = 'none';
    }, { passive: true });

    wrapper.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      hasSwiped = true;
      const touch = e.touches[0];
      currentX = touch.clientX;
      const delta = currentX - startX;
      const limitedDelta = Math.max(-120, Math.min(120, delta));
      wrapper.style.transform = `translateX(${limitedDelta}px) rotate(${limitedDelta * 0.05}deg)`;
      record.style.transform = `rotate(${limitedDelta * 0.02}deg)`;
    }, { passive: true });

    wrapper.addEventListener('touchend', function(e) {
      if (!isDragging) return;
      isDragging = false;
      wrapper.classList.remove('swiping');
      const delta = currentX - startX;

      if (delta < -SWIPE_THRESHOLD && currentIndex < MONTHLY_TRACKS.length - 1) {
        wrapper.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
        wrapper.style.transform = 'translateX(-40px) rotate(-2deg)';
        setTimeout(() => {
          goToNext();
          wrapper.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
          wrapper.style.transform = 'translateX(0) rotate(0deg)';
          record.style.transform = 'rotate(0deg)';
        }, 300);
      } else if (delta > SWIPE_THRESHOLD && currentIndex > 0) {
        wrapper.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
        wrapper.style.transform = 'translateX(40px) rotate(2deg)';
        setTimeout(() => {
          goToPrev();
          wrapper.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
          wrapper.style.transform = 'translateX(0) rotate(0deg)';
          record.style.transform = 'rotate(0deg)';
        }, 300);
      } else {
        wrapper.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        wrapper.style.transform = 'translateX(0) rotate(0deg)';
        record.style.transform = 'rotate(0deg)';
        if (!hasSwiped) togglePlay();
        hasSwiped = false;
      }
    }, { passive: true });

    // 鼠标
    let mouseDown = false;
    let mouseStartX = 0;
    let mouseCurrentX = 0;

    wrapper.addEventListener('mousedown', function(e) {
      hasSwiped = false;
      mouseDown = true;
      mouseStartX = e.clientX;
      mouseCurrentX = mouseStartX;
      wrapper.classList.add('swiping');
      wrapper.style.transition = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!mouseDown) return;
      hasSwiped = true;
      mouseCurrentX = e.clientX;
      const delta = mouseCurrentX - mouseStartX;
      const limitedDelta = Math.max(-120, Math.min(120, delta));
      wrapper.style.transform = `translateX(${limitedDelta}px) rotate(${limitedDelta * 0.05}deg)`;
      record.style.transform = `rotate(${limitedDelta * 0.02}deg)`;
    });

    document.addEventListener('mouseup', function(e) {
      if (!mouseDown) return;
      mouseDown = false;
      wrapper.classList.remove('swiping');
      const delta = mouseCurrentX - mouseStartX;

      if (delta < -SWIPE_THRESHOLD && currentIndex < MONTHLY_TRACKS.length - 1) {
        wrapper.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
        wrapper.style.transform = 'translateX(-40px) rotate(-2deg)';
        setTimeout(() => {
          goToNext();
          wrapper.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
          wrapper.style.transform = 'translateX(0) rotate(0deg)';
          record.style.transform = 'rotate(0deg)';
        }, 300);
      } else if (delta > SWIPE_THRESHOLD && currentIndex > 0) {
        wrapper.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
        wrapper.style.transform = 'translateX(40px) rotate(2deg)';
        setTimeout(() => {
          goToPrev();
          wrapper.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
          wrapper.style.transform = 'translateX(0) rotate(0deg)';
          record.style.transform = 'rotate(0deg)';
        }, 300);
      } else {
        wrapper.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        wrapper.style.transform = 'translateX(0) rotate(0deg)';
        record.style.transform = 'rotate(0deg)';
        if (!hasSwiped) togglePlay();
        hasSwiped = false;
      }
    });

    // 音乐播放结束
    audio.addEventListener('ended', function() {
      isPlaying = false;
      stopTimer();
      record.style.animationPlayState = 'paused';
      trackNameEl.classList.add('show');
      trackSourceEl.classList.add('show');
      console.log('🎵 音乐播放结束');
    });

    // ===== 启动 =====
    if (MONTHLY_TRACKS.length > 0) {
      loadTrack(0, false);
      audio.load();
      stopTimer();
      timerEl.classList.add('paused');
      record.style.animationPlayState = 'paused';
    }

    console.log('📱 三径 · 私人音乐已加载');
    console.log('🎵 当前使用本地音乐: music/track-01.m4a, music/track-02.m4a');
    console.log('📌 如果听不到声音，请检查文件是否存在');
  </script>
</body>
</html>
